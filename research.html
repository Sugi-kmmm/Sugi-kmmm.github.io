<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Sugi_kmmm, Robot Creator</title>
    <meta name="keywords" content="杉原怜, Rei Sugihara, Sugi_kmmm, ロボット, Robot Creator">
    <meta name="description" content="研究内容">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="/index.css">
    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-NXD2PSG4');</script>
    <!-- End Google Tag Manager -->
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NXD2PSG4" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="header-include"></div>
    <script>
        fetch('/js_includes/header.html')
            .then(res => res.text())
            .then(data => document.getElementById('header-include').innerHTML = data);
    </script>

    <main id="content">
        <div class="inner">
            <h2>研究業績（共著含む）</h2>

            <!--
                ■ 業績の追加・修正方法
                research/<年>/ に業績1件につき1つの .md ファイル（例 research/2024/2024robomech_1.md）を置いて push するだけです．
                HTML を書く必要はありません．書き方は research/README.md，ひな形は research/_template/ を見てください．
            -->
            <input type="search" id="publication-search" class="pub-search"
                placeholder="タイトル・著者・掲載誌で検索（スペース区切りで AND 検索）" aria-label="研究業績を検索" hidden>
            <p id="publication-status" class="pub-empty">読み込み中…</p>
            <div id="publication-tabs" class="publication-tabs" hidden>
                <div class="pub-tablist" role="tablist" aria-label="年別の研究業績"></div>
                <div class="pub-panel" role="tabpanel"></div>
            </div>
        </div>
    </main>

    <script src="/js_includes/research-data.js"></script>
    <script src="/js_includes/publications.js"></script>

    <div id="footer-include"></div>
    <script>
        fetch('/js_includes/footer.html')
            .then(res => res.text())
            .then(data => document.getElementById('footer-include').innerHTML = data);
    </script>
</body>

</html>
