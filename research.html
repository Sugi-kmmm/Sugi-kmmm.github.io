# ↑ この front matter は research/ 配下のページ一覧を GitHub Pages (Jekyll) に作らせるために必要です．消さないでください．
---
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Sugi_kmmm, Robot Creator</title>
    <meta name="keywords" content="杉原怜, Rei Sugihara, Sugi_kmmm, ロボット, Robot Creator">
    <meta name="description" content="研究内容">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="/index.css">
    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-NXD2PSG4');</script>
    <!-- End Google Tag Manager -->
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NXD2PSG4" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="header-include"></div>
    <script>
        fetch('/js_includes/header.html')
            .then(res => res.text())
            .then(data => document.getElementById('header-include').innerHTML = data);
    </script>

    <main id="content">
        <div class="inner">
            <h2>研究業績</h2>

            <!--
                ■ 業績の追加方法
                research/ に publication-table を含むページを置くだけで，この一覧に自動で表示されます．
                （research/_template.html をコピーして作成してください．ファイル名が _ で始まるものは対象外）
                表の各行から以下を読み取ります．
                  タイトル          : 一覧の見出し（リンク）
                  種別              : グループ分け（/js_includes/publications.js の CATEGORY_ORDER の順．「国内会議発表（口頭）」のように
                                      先頭が一致すれば同じ順位として扱います．無い場合は「その他」）
                  出版日 / 学位取得日 / 受賞日 : 年タブの振り分けと並び順（例: 2026年1月25日）
                  著者，掲載誌，巻，号，ページ : 一覧の補足情報
            -->
            <script type="application/json" id="publication-urls">
                {% assign urls = "" | split: "" %}
                {% for f in site.static_files %}{% assign head = f.path | slice: 0, 10 %}{% if head == "/research/" and f.extname == ".html" %}{% assign urls = urls | push: f.path %}{% endif %}{% endfor %}
                {% for p in site.pages %}{% if p.dir == "/research/" %}{% assign urls = urls | push: p.url %}{% endif %}{% endfor %}
                {{ urls | jsonify }}
            </script>

            <p id="publication-status" class="pub-empty">読み込み中…</p>
            <div id="publication-tabs" class="publication-tabs" hidden>
                <div class="pub-tablist" role="tablist" aria-label="年別の研究業績"></div>
                <div class="pub-panel" role="tabpanel"></div>
            </div>
        </div>
    </main>

    <script src="/js_includes/publications.js"></script>

    <div id="footer-include"></div>
    <script>
        fetch('/js_includes/footer.html')
            .then(res => res.text())
            .then(data => document.getElementById('footer-include').innerHTML = data);
    </script>
</body>

</html>
